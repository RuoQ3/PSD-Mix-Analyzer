name: PSD Analyzer
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev,excel,visualization,persistence,ui]" -c requirements.lock
      - run: python -m ruff check src tests examples
      - run: python -m ruff format --check src tests examples
      - run: python -m mypy src
      - run: python -m pytest --cov=psd_analyzer.domain --cov-report=term-missing
      - run: python examples/domain_demo.py
      - run: python examples/psd_mixing_demo.py
      - run: python examples/excel_analysis_demo.py
      - run: python examples/application_visualization_demo.py
