[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "psd-mix-analyzer"
version = "0.4.0"
description = "Independent particle size distribution mixing and monitoring core"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2"]

[project.optional-dependencies]
excel = ["openpyxl>=3.1.5,<4"]
visualization = ["plotly>=6,<7"]
persistence = ["sqlalchemy>=2,<3"]
ui = ["streamlit>=1.64,<2", "sqlalchemy>=2,<3", "openpyxl>=3.1.5,<4", "plotly>=6,<7"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1", "mypy>=1.14,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["psd_analyzer.domain"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
module = ["scipy.*", "openpyxl.*", "plotly.*"]
ignore_missing_imports = true
